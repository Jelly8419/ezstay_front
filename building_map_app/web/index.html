  <script>
    // PayTag SDK 초기화 (SDK 로드 후 1회 실행)
    window.addEventListener('DOMContentLoaded', function () {
      var checkTag = function (attempts) {
        if (typeof Tag !== 'undefined' && Tag.init) {
          var shopcode = window.__ENV__.PAYTAG_SHOPCODE || '1901110002';
          Tag.init(shopcode, 'ezstay');
        } else if (attempts < 50) {
          setTimeout(function () { checkTag(attempts + 1); }, 100);
        } else {
          console.error('❌ [PayTag] SDK 로드 타임아웃');
        }
      };
      checkTag(0);
    });
  </script>

  <!-- Firebase 초기화 (SDK 로드 후 실행) -->
  <script defer>
    // Firebase SDK 로드 대기 후 초기화
    window.addEventListener('DOMContentLoaded', function () {
      // Firebase SDK 로드 확인 (최대 5초 대기)
      let attempts = 0;
      const maxAttempts = 50;
      const checkInterval = 100; // 100ms

      const initFirebase = function () {
        if (typeof firebase !== 'undefined') {
          console.log('🔥 [WEB] Firebase SDK 로드 확인: OK');
          try {
            if (!firebase.apps.length) {
              console.log('🔥 [WEB] Firebase 웹 초기화 시작...');
              const app = firebase.initializeApp(window.firebaseConfig);
              console.log('✅ [WEB] Firebase 웹 초기화 완료');
              console.log('✅ [WEB] App name:', app.name);
            } else {
              console.log('⚠️ [WEB] Firebase 이미 초기화됨');
            }
          } catch (error) {
            console.error('❌ [WEB] Firebase 초기화 에러:', error);
          }
        } else if (attempts < maxAttempts) {
          attempts++;
          setTimeout(initFirebase, checkInterval);
        } else {
          console.error('❌ [WEB] Firebase SDK 로드 타임아웃 (5초)');
        }
      };

      // 초기화 시작
      initFirebase();
    });
  </script>

  <!-- .part.js 로딩 실패 자동 감지 → 캐시 삭제 후 새로고침 (1회만) -->
  <script>
    window.addEventListener('error', function (e) {
      var msg = (e.message || '') + ' ' + (e.filename || '');
      if (msg.indexOf('.part.js') !== -1 && !sessionStorage.getItem('_partjs_reload')) {
        console.log('🔄 [AutoReload] .part.js 로딩 실패 감지, 캐시 삭제 후 새로고침');
        sessionStorage.setItem('_partjs_reload', '1');
        // 캐시 전부 삭제 후 새로고침
        if ('caches' in window) {
          caches.keys().then(function (names) {
            return Promise.all(names.map(function (n) { return caches.delete(n); }));
          }).then(function () { window.location.reload(); });
        } else {
          window.location.reload();
        }
      }
    }, true);
    // 정상 로드 시 플래그 제거 (무한 리로드 방지)
    window.addEventListener('flutter-first-frame', function () {
      sessionStorage.removeItem('_partjs_reload');
    });
  </script>

  <!-- 서비스 워커 해제: .part.js 캐시 불일치 방지 -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        for (var reg of registrations) {
          reg.unregister().then(function () {
            console.log('🧹 [SW] 서비스 워커 해제 완료');
          });
        }
      });
      // 서비스 워커 캐시도 전부 삭제
      if ('caches' in window) {
        caches.keys().then(function (names) {
          for (var name of names) {
            caches.delete(name);
            console.log('🧹 [Cache] 삭제:', name);
          }
        });
      }
    }
  </script>
