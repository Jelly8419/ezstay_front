  <!-- Firebase 초기화 (SDK 로드 후 실행) -->
  <script defer>
    // Firebase SDK 로드 대기 후 초기화
    window.addEventListener('DOMContentLoaded', function() {
      // Firebase SDK 로드 확인 (최대 5초 대기)
      let attempts = 0;
      const maxAttempts = 50;
      const checkInterval = 100; // 100ms

      const initFirebase = function() {
        if (typeof firebase !== 'undefined') {
          console.log('🔥 [WEB] Firebase SDK 로드 확인: OK');
          try {
            if (!firebase.apps.length) {
              console.log('🔥 [WEB] Firebase 웹 초기화 시작...');
              const app = firebase.initializeApp(window.firebaseConfig);
              console.log('✅ [WEB] Firebase 웹 초기화 완료');
              console.log('✅ [WEB] App name:', app.name);
            } else {
              console.log('⚠️ [WEB] Firebase 이미 초기화됨');
            }
          } catch (error) {
            console.error('❌ [WEB] Firebase 초기화 에러:', error);
          }
        } else if (attempts < maxAttempts) {
          attempts++;
          setTimeout(initFirebase, checkInterval);
        } else {
          console.error('❌ [WEB] Firebase SDK 로드 타임아웃 (5초)');
        }
      };

      // 초기화 시작
      initFirebase();
    });
  </script>

  <style>
    /* 로딩 스플래시 스크린 */
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #FAFAFA;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }
    #loading.fade-out {
      opacity: 0;
    }
    .loading-content {
      text-align: center;
    }
    .loading-logo {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }
    .loading-text {
      color: #2196F3;
      font-size: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin-top: 20px;
    }
    .loading-spinner {
      border: 3px solid #E3F2FD;
      border-top: 3px solid #2196F3;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
  </style>
</head>
<body>
  <!-- 로딩 스플래시 -->
  <div id="loading">
    <div class="loading-content">
      <img src="icons/Icon-192.png" alt="EZStay" class="loading-logo">
      <div class="loading-spinner"></div>
      <div class="loading-text">로딩 중...</div>
    </div>
  </div>

  <script>
    // Flutter 첫 프레임 렌더링 후 로딩 화면 제거
    window.addEventListener('flutter-first-frame', function() {
      var loadingElement = document.getElementById('loading');
      if (loadingElement) {
        loadingElement.classList.add('fade-out');
        setTimeout(function() {
          loadingElement.style.display = 'none';
        }, 300);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
