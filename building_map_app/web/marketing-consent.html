<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마케팅 정보 수신 동의 - 이지스테이</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F8FAFE; font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif; color: #1A1A1A; }
    .container { max-width: 896px; margin: 0 auto; padding: 48px 24px; }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 32px; }
    p { font-size: 15px; color: #666; line-height: 1.8; }
    .bullet { display: flex; gap: 8px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 14px; }
    th { background: #E5E7EB; color: #1A1A1A; font-weight: 600; padding: 10px 12px; text-align: left; border: 1px solid #E5E7EB; }
    td { background: #fff; color: #666; padding: 10px 12px; border: 1px solid #E5E7EB; line-height: 1.7; vertical-align: top; }
  </style>
</head>
<body>
<div class="container">
  <h1>마케팅 정보 수신 동의</h1>

  <div class="bullet">
    <span>•</span>
    <p>마케팅 정보 수신 여부 및 마케팅을 위한 개인정보 수집이용을 거부하실 수 있으며, 거부 시에도 이지스테이를 이용하실 수 있습니다.</p>
  </div>

  <table>
    <thead>
      <tr>
        <th>구분</th>
        <th>수집·이용 목적</th>
        <th>수집 항목</th>
        <th>보유·이용기간</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>선택</td>
        <td>추천, 이벤트 등의 광고성 정보 제공 및 안내</td>
        <td>마케팅 수신 동의 (푸시알림, 이메일, 카카오톡, SMS 등)</td>
        <td>수신 동의 철회 및 회원 탈퇴 시</td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
