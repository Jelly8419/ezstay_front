<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SDK 테스트</title>
</head>
<body>
    <h1>카카오 SDK 로드 테스트</h1>
    <div id="result">테스트 중...</div>

    <script>
        console.log('1. 스크립트 시작');
        var result = document.getElementById('result');

        var script = document.createElement('script');
        script.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=7b8e75100e5af72db70a46c3fef81128';

        script.onload = function() {
            console.log('2. SDK 로드 성공');
            result.innerHTML = '✅ SDK 로드 성공! kakao 객체 확인: ' + (typeof kakao !== 'undefined' ? 'OK' : 'FAIL');
            result.style.color = 'green';
        };

        script.onerror = function(e) {
            console.error('2. SDK 로드 실패', e);
            result.innerHTML = '❌ SDK 로드 실패 - 카카오 개발자 콘솔에서 Web 플랫폼에 http://localhost:3000 추가 필요!';
            result.style.color = 'red';
        };

        document.head.appendChild(script);
        console.log('3. 스크립트 추가 완료');
    </script>
</body>
</html>
