name: Deploy Flutter Web to Test Server (EC2)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  REMOTE_UPLOAD_PATH: '/opt/ezstay/frontend/flutter'
  REMOTE_NGINX_PATH: '/var/www/flutter'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ==========================================
      # 1. 환경 설정
      # ==========================================
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get GitHub Actions Runner IP
        id: runner-ip
        run: |
          IP=$(curl -s https://api.ipify.org || curl -s https://ifconfig.me || curl -s https://icanhazip.com)
          if [ -z "$IP" ]; then
            echo "Failed to get public IP"
            exit 1
          fi
          echo "ipv4=$IP" >> $GITHUB_OUTPUT
          echo "Runner IP: $IP"

      - name: Add Runner IP to AWS Security Group
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner-ip.outputs.ipv4 }}/32" \
            --region "${{ secrets.AWS_REGION }}" \
            || echo "Rule may already exist (continuing...)"

      # ==========================================
      # 2. Flutter 빌드
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env for build
        working-directory: ./building_map_app
        run: |
          cat > .env << EOF
          API_BASE_URL=${{ secrets.TEST_API_URL }}
          KAKAO_REST_API_KEY=${{ secrets.TEST_KAKAO_REST_KEY }}
          KAKAO_JAVASCRIPT_KEY=${{ secrets.TEST_KAKAO_JS_KEY }}
          IS_PRODUCTION=false
          TOSS_CLIENT_KEY=${{ secrets.TEST_TOSS_CLIENT_KEY }}
          PAYMENT_MOCK_MODE=true
          API_TIMEOUT_SECONDS=10
          ENVIRONMENT=test
          EOF

      - name: Install dependencies
        working-directory: ./building_map_app
        run: flutter pub get

      - name: Generate env_config.js (test)
        working-directory: ./building_map_app/web/js
        env:
          KAKAO_JS_KEY: ${{ secrets.TEST_KAKAO_JS_KEY }}
          KAKAO_REST_KEY: ${{ secrets.TEST_KAKAO_REST_KEY }}
          FIREBASE_API_KEY: ${{ secrets.TEST_FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.TEST_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.TEST_FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.TEST_FIREBASE_STORAGE_BUCKET }}
          FIREBASE_SENDER_ID: ${{ secrets.TEST_FIREBASE_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.TEST_FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.TEST_FIREBASE_MEASUREMENT_ID }}
          PAYTAG_SHOPCODE: ${{ secrets.TEST_PAYTAG_SHOPCODE }}
        run: |
          # Secrets에 줄바꿈이 포함될 수 있으므로 tr로 제거
          KAKAO_JS_KEY=$(echo "${KAKAO_JS_KEY}" | tr -d '\r\n')
          KAKAO_REST_KEY=$(echo "${KAKAO_REST_KEY}" | tr -d '\r\n')
          FIREBASE_API_KEY=$(echo "${FIREBASE_API_KEY}" | tr -d '\r\n')
          FIREBASE_AUTH_DOMAIN=$(echo "${FIREBASE_AUTH_DOMAIN}" | tr -d '\r\n')
          FIREBASE_PROJECT_ID=$(echo "${FIREBASE_PROJECT_ID}" | tr -d '\r\n')
          FIREBASE_STORAGE_BUCKET=$(echo "${FIREBASE_STORAGE_BUCKET}" | tr -d '\r\n')
          FIREBASE_SENDER_ID=$(echo "${FIREBASE_SENDER_ID}" | tr -d '\r\n')
          FIREBASE_APP_ID=$(echo "${FIREBASE_APP_ID}" | tr -d '\r\n')
          FIREBASE_MEASUREMENT_ID=$(echo "${FIREBASE_MEASUREMENT_ID}" | tr -d '\r\n')
          PAYTAG_SHOPCODE=$(echo "${PAYTAG_SHOPCODE}" | tr -d '\r\n')

          {
            echo "window.__ENV__ = {"
            echo "  ENVIRONMENT: 'test',"
            echo "  KAKAO_JS_KEY: '${KAKAO_JS_KEY}',"
            echo "  KAKAO_REST_API_KEY: '${KAKAO_REST_KEY}',"
            echo "  FIREBASE_API_KEY: '${FIREBASE_API_KEY}',"
            echo "  FIREBASE_AUTH_DOMAIN: '${FIREBASE_AUTH_DOMAIN}',"
            echo "  FIREBASE_PROJECT_ID: '${FIREBASE_PROJECT_ID}',"
            echo "  FIREBASE_STORAGE_BUCKET: '${FIREBASE_STORAGE_BUCKET}',"
            echo "  FIREBASE_MESSAGING_SENDER_ID: '${FIREBASE_SENDER_ID}',"
            echo "  FIREBASE_APP_ID: '${FIREBASE_APP_ID}',"
            echo "  FIREBASE_MEASUREMENT_ID: '${FIREBASE_MEASUREMENT_ID}',"
            echo "  PAYTAG_SHOPCODE: '${PAYTAG_SHOPCODE}',"
            echo "  PAYTAG_SDK_URL: 'https://apit.paytag.kr/std_pay/paytag_std.js?version=20251104',"
            echo "};"
          } > env_config.js

      - name: Build Flutter web
        working-directory: ./building_map_app
        run: |
          flutter build web --release \
            --base-href=/app/ \
            --pwa-strategy=none \
            --dart-define=ENVIRONMENT=test \
            --dart-define=API_BASE_URL=${{ secrets.TEST_API_URL }} \
            --dart-define=KAKAO_REST_API_KEY=${{ secrets.TEST_KAKAO_REST_KEY }} \
            --dart-define=KAKAO_JAVASCRIPT_KEY=${{ secrets.TEST_KAKAO_JS_KEY }} \
            --dart-define=TOSS_CLIENT_KEY=${{ secrets.TEST_TOSS_CLIENT_KEY }}

      - name: Add cache busting
        working-directory: ./building_map_app/build/web
        run: |
          BUILD_VERSION=$(date +%Y%m%d%H%M%S)

          # index.html에서 flutter_bootstrap.js에만 버전 태그 추가
          # (flutter_bootstrap.js 내부의 main.dart.js, .part.js는 수정하지 않음
          #  — .part.js 파일과 main.dart.js는 같은 빌드에서 생성되므로
          #  부분적 cache busting은 불일치를 유발함)
          sed -i "s/flutter_bootstrap.js/flutter_bootstrap.js?v=${BUILD_VERSION}/g" index.html

          echo "Cache busting version: $BUILD_VERSION"
      - name: Remove service worker
        working-directory: ./building_map_app/build/web
        run: |
          rm -f flutter_service_worker.js
          echo "Service worker removed"
      # ==========================================
      # 3. SSH 설정
      # ==========================================
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TEST_SERVER_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H -p ${{ secrets.TEST_SERVER_PORT }} \
            ${{ secrets.TEST_SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      # ==========================================
      # 4. EC2 배포
      # ==========================================
      - name: Clean old files on server
        run: |
          ssh -i ~/.ssh/deploy_key.pem \
            -p ${{ secrets.TEST_SERVER_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }} \
            "sudo rm -rf ${{ env.REMOTE_UPLOAD_PATH }}/web && \
             sudo rm -rf ${{ env.REMOTE_NGINX_PATH }}/* && \
             echo 'Cleanup completed'"

      - name: Upload build to EC2
        run: |
          ssh -i ~/.ssh/deploy_key.pem \
            -p ${{ secrets.TEST_SERVER_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }} \
            "sudo mkdir -p ${{ env.REMOTE_UPLOAD_PATH }}"

          scp -i ~/.ssh/deploy_key.pem \
            -P ${{ secrets.TEST_SERVER_PORT }} \
            -o StrictHostKeyChecking=no \
            -r building_map_app/build/web \
            ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }}:${{ env.REMOTE_UPLOAD_PATH }}/

      - name: Deploy to Nginx
        run: |
          ssh -i ~/.ssh/deploy_key.pem \
            -p ${{ secrets.TEST_SERVER_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }} << DEPLOY_SCRIPT

          sudo mkdir -p ${{ env.REMOTE_NGINX_PATH }}
          sudo cp -r ${{ env.REMOTE_UPLOAD_PATH }}/web/* ${{ env.REMOTE_NGINX_PATH }}/

          # .part.js 파일 수 확인 (빌드 완전성 검증)
          PART_COUNT=\$(ls ${{ env.REMOTE_NGINX_PATH }}/main.dart.js_*.part.js 2>/dev/null | wc -l)
          echo "Deployed .part.js files: \$PART_COUNT"

          # Kakao Maps SDK 스크립트 누락 시 주입 (안전장치)
          if ! grep -q "dapi.kakao.com/v2/maps/sdk.js" ${{ env.REMOTE_NGINX_PATH }}/index.html; then
            echo "Kakao Maps script missing, injecting..."
            sudo sed -i 's|</head>|  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=${{ env.KAKAO_JS_KEY }}"></script>\n</head>|' ${{ env.REMOTE_NGINX_PATH }}/index.html
          fi

          sudo chown -R nginx:nginx ${{ env.REMOTE_NGINX_PATH }}
          sudo chmod -R 755 ${{ env.REMOTE_NGINX_PATH }}
          sudo nginx -t
          sudo systemctl reload nginx

          echo "Deployment completed"
          DEPLOY_SCRIPT

      # ==========================================
      # 5. 배포 확인
      # ==========================================
      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key.pem \
            -p ${{ secrets.TEST_SERVER_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.TEST_SERVER_USER }}@${{ secrets.TEST_SERVER_HOST }} << 'VERIFY_SCRIPT'

          echo "Files in Nginx path:"
          ls -lh /var/www/flutter | head -10

          echo ""
          echo "Disk usage:"
          du -sh /var/www/flutter

          echo ""
          echo "Kakao key in index.html:"
          grep -o 'appkey=[a-f0-9]*' /var/www/flutter/index.html || echo "Not found"
          VERIFY_SCRIPT

      # ==========================================
      # 6. 보안 그룹 정리 (항상 실행)
      # ==========================================
      - name: Remove Runner IP from Security Group
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SECURITY_GROUP_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner-ip.outputs.ipv4 }}/32" \
            --region "${{ secrets.AWS_REGION }}" \
            || echo "Rule may not exist (continuing...)"

      - name: Deployment summary
        if: success()
        run: |
          echo "======================================"
          echo "  Test Server Deployment Successful!"
          echo "======================================"
          echo ""
          echo "API URL: ${{ secrets.TEST_API_URL }}"
          echo "Server: ${{ secrets.TEST_SERVER_HOST }}"
          echo ""

      - name: Slack 배포 알림
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,ref,workflow,took
          text: |
            레포: ${{ github.repository }}
            브랜치: ${{ github.ref_name }}
            커밋: ${{ github.sha }}
            트리거: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
